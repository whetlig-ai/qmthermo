[project]
name = "qmthermo"
dynamic = ["version"]
authors = [
    { name="Moshchenkov Andrei", email="whetlig@gmail.com"}
]
description = "Python package to calculate thermochemistry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/whetlig-ai/qmthermo"
Issues = "https://github.com/whetlig-ai/qmthermo/issues"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/qmthermo/__init__.py"

[project.optional-dependencies]
dev = ["pytest"]

